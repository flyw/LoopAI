[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loopai-agent-loop"
dynamic = ["version"]
description = "A spec-first, resumable orchestration loop for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LoopAI contributors" }]
keywords = ["coding-agent", "codex", "orchestration", "verification", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/flyw/LoopAI"
Repository = "https://github.com/flyw/LoopAI"
Issues = "https://github.com/flyw/LoopAI/issues"

[project.scripts]
loopai = "loopai.cli:main"
loopai-mcp = "loopai.mcp_server:main"

[tool.hatch.version]
path = "src/loopai/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/loopai"]
