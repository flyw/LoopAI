[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loopai-agent-loop"
version = "0.1.0"
description = "Reactive two-agent executor/verifier loop powered by Codex"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LoopAI contributors" }]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
loopai = "loopai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loopai"]
